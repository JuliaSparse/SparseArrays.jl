name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release-*'
    tags: '*'
permissions:
  contents: read
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')) || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.julia-arch }}, ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        julia-arch:
          - x64
          - x86
        julia-version:
          - 'nightly'
        include:
          - os: macOS-latest
            julia-arch: aarch64
            julia-version: 'nightly'
            check-bounds: 'yes'
          - os: ubuntu-latest
            julia-arch: x64
            julia-version: 'nightly'
            coverage: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage == true }}
          check_bounds: ${{ matrix.check-bounds || 'auto' }}
          depwarn: 'error'
        env:
          # the coverage job (Linux x64) runs the tests in comprehensive mode instead of
          # standard mode, so that coverage counts the guarded tests
          SPARSEARRAYS_TEST_COMPREHENSIVE: ${{ matrix.coverage == true }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage == true
      - uses: codecov/codecov-action@v7
        if: matrix.coverage == true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  aqua-test:
    name: aqua-test (ubuntu-latest, x64, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Check whitespace
        run: |
          julia --color=yes .ci/check-whitespace.jl
      - name: Check that only src/solvers and test/solvers use the GPL solvers
        if: ${{ !cancelled() }}
        run: |
          julia --color=yes .ci/check-gpl-usage.jl
      - name: Run ambiguity tests
        if: ${{ !cancelled() }}
        run: |
          julia --color=yes --project -e 'using Pkg; Pkg.test(test_args=["ambiguous"])'
      - name: Run Aqua tests
        if: ${{ !cancelled() }}
        run: |
          julia --color=yes --project -e 'using Pkg; Pkg.test(test_args=["aqua"])'
  trim:
    name: trim (ubuntu-latest, x64, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Build and run a trimmed app
        run: |
          julia --color=yes --project=@juliac -e 'using Pkg; Pkg.add("JuliaC")'
          julia --color=yes --project=test/trim -e 'using Pkg; Pkg.instantiate()'
          julia --color=yes --project=@juliac -m JuliaC --output-exe sparsetrim --trim=safe --experimental --bundle build test/trim
          build/bin/sparsetrim
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - uses: julia-actions/cache@v3
      - name: Generate docs
        run: |
          julia --project=docs --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs --color=yes docs/make.jl
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
