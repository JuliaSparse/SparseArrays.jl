name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release-*'
    tags: '*'
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.julia-arch }}, ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        julia-arch:
          - x64
          - x86
        julia-version:
          - 'nightly'
        include:
          - os: macOS-latest
            julia-arch: aarch64
            julia-version: 'nightly'
          # Only one job runs with coverage instrumentation and forced bounds checking
          # (`--check-bounds=yes`). Both invalidate precompiled code, and the test suite
          # is 95%+ JIT time, so they multiply the wall time of every job they are on.
          - os: ubuntu-latest
            julia-arch: x64
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage == true }}
          check_bounds: ${{ matrix.coverage == true && 'yes' || 'no' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage == true
      - uses: codecov/codecov-action@v7
        if: matrix.coverage == true
        with:
          file: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  aqua-test:
    name: aqua-test (${{ matrix.os }}, ${{ matrix.julia-arch }}, ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      matrix:
        os:
          - ubuntu-latest
        julia-arch:
          - x64
        julia-version:
          - 'nightly'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - name: Run Aqua and ambiguity tests
        run: |
          julia --color=yes -e 'using Pkg; Pkg.activate(temp=true); Pkg.develop(path=pwd()); Pkg.add(name="Aqua", version="0.8"); include(joinpath(pwd(), "test", "ambiguous.jl"))'
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - uses: julia-actions/cache@v3
      - name: Generate docs
        run: |
          julia --project --color=yes -e 'using Pkg; Pkg.activate("docs"); Pkg.develop(PackageSpec(path = pwd()))'
          julia --project=docs --color=yes docs/make.jl pdf
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
