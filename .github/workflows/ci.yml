name: CI
on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'release-*'
    tags: '*'
permissions:
  contents: read
concurrency:
  # Skip intermediate builds: all builds except for builds on the `main` or `release-*` branches
  # Cancel intermediate builds: only pull request builds
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/release-')) || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.julia-arch }}, ${{ matrix.julia-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        julia-arch:
          - x64
          - x86
        julia-version:
          - 'nightly'
        include:
          # Coverage instrumentation and forced bounds checking (`--check-bounds=yes`)
          # each invalidate precompiled code, and the test suite is 95%+ JIT time, so
          # each runs on one job only, and never both on the same job. The matrix values
          # are part of the julia-actions/cache key, so each job's flags must stay fixed,
          # or a cache built with other flags is restored and everything is precompiled
          # again. The other jobs use `--check-bounds=auto` (Julia's default, matching the
          # precompiled code); `no` would break the tests that expect a `BoundsError`.
          # Coverage also slows every test, so it goes on ubuntu x64, which has more cores
          # and memory than the macOS runner; bounds checking costs little.
          - os: macOS-latest
            julia-arch: aarch64
            julia-version: 'nightly'
            check-bounds: 'yes'
          - os: ubuntu-latest
            julia-arch: x64
            julia-version: 'nightly'
            coverage: true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: ${{ matrix.julia-arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage == true }}
          check_bounds: ${{ matrix.check-bounds || 'auto' }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage == true
      - uses: codecov/codecov-action@v7
        if: matrix.coverage == true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  serial-test:
    # Julia Base CI runs test/runtests.jl without ParallelTestRunner, so the serial
    # fallback must keep working; a load path of only the project and the stdlibs
    # hides any globally installed ParallelTestRunner.
    name: serial-test (ubuntu-latest, x64, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run the tests serially, as Julia Base CI does
        run: |
          julia --color=yes --project --startup-file=no test/runtests.jl
        env:
          JULIA_LOAD_PATH: '@:@stdlib'
  aqua-test:
    name: aqua-test (ubuntu-latest, x64, nightly)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Run Aqua and ambiguity tests
        run: |
          julia --color=yes --project -e 'using Pkg; Pkg.test(test_args=["ambiguous"])'
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'nightly'
      - uses: julia-actions/cache@v3
      - name: Generate docs
        run: |
          julia --project=docs --color=yes -e 'using Pkg; Pkg.instantiate()'
          julia --project=docs --color=yes docs/make.jl
        env:
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
