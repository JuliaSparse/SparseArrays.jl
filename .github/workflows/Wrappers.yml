name: Wrappers

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'gen/**'
      - 'src/solvers/wrappers.jl'
      - 'Project.toml'
      - '.ci/check-suitesparse-version.jl'
      - '.github/workflows/Wrappers.yml'
  pull_request:
    paths:
      - 'gen/**'
      - 'src/solvers/wrappers.jl'
      - 'Project.toml'
      - '.ci/check-suitesparse-version.jl'
      - '.github/workflows/Wrappers.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  wrappers:
    name: Regenerate the SuiteSparse wrappers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    steps:
      - name: Checkout the JuliaSparse/SparseArrays.jl repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Clang.jl supports released Julia only, so this job does not run on nightly.
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Check that gen/Makefile and Project.toml agree on the SuiteSparse version
        run: julia .ci/check-suitesparse-version.jl
      - name: Regenerate src/solvers/wrappers.jl
        run: make -C gen
      - name: Check that the committed wrappers match the regenerated ones
        run: git diff --exit-code -- src/solvers/wrappers.jl
