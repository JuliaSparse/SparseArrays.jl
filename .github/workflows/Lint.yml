name: Lint

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  lint:
    name: Lint whitespace and GPL usage
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout the JuliaSparse/SparseArrays.jl repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - name: Check whitespace
        run: |
          julia .ci/check-whitespace.jl
      - name: Check that only src/solvers and test/solvers use the GPL solvers
        run: |
          julia .ci/check-gpl-usage.jl
